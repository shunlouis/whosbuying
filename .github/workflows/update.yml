name: 每日資料更新

on:
  schedule:
    # 台灣時間 17:30 = UTC 09:30（提前30分鐘，因 GitHub Actions 常延遲30-180分鐘）
    - cron: '30 9 * * 1-5'
  # 手動觸發（測試用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/signals_history.json
          git diff --cached --quiet || git commit -m "chore: 每日資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台灣時間"
          git push
